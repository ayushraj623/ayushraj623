<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#0a2540"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#7df9ff"/>
      <stop offset="0.7" stop-color="#3a5bd9"/>
      <stop offset="1" stop-color="#1a1050"/>
    </radialGradient>
    <radialGradient id="sCyan" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#e0ffff"/><stop offset="0.5" stop-color="#00f2fe"/><stop offset="1" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="sPurple" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f3e8ff"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="sPink" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe4f1"/><stop offset="0.5" stop-color="#ec4899"/><stop offset="1" stop-color="#831843"/>
    </radialGradient>
    <radialGradient id="sGreen" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#dcfce7"/><stop offset="0.5" stop-color="#22c55e"/><stop offset="1" stop-color="#14532d"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="900" height="320" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="260" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="70" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="285" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="275" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="60" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="200" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="170" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orbit rings (tilted for a 3D look) -->
  <g transform="rotate(-14 450 160)" fill="none" stroke-width="1.2">
    <ellipse cx="450" cy="160" rx="330" ry="62" stroke="#00f2fe" stroke-opacity="0.35" stroke-dasharray="4 6"/>
    <ellipse cx="450" cy="160" rx="230" ry="42" stroke="#a855f7" stroke-opacity="0.45" stroke-dasharray="2 5"/>
  </g>

  <!-- core: floating AI planet -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="450" cy="248" rx="40" ry="7" fill="#000" opacity="0.45" filter="url(#shadow)"/>
    <circle cx="450" cy="160" r="52" fill="url(#core)" filter="url(#glow)"/>
    <ellipse cx="450" cy="160" rx="82" ry="14" fill="none" stroke="#7df9ff" stroke-width="2" opacity="0.8" transform="rotate(-20 450 160)"/>
    <text x="450" y="170" text-anchor="middle" font-family="monospace" font-weight="700" font-size="28" fill="#0f0c29">AI</text>
  </g>

  <!-- satellites on orbits -->
  <g transform="rotate(-14 450 160)">
    <g>
      <circle r="13" fill="url(#sCyan)" filter="url(#glow)"/>
      <animateMotion dur="22s" repeatCount="indefinite" path="M 120,160 A 330,62 0 1,1 780,160 A 330,62 0 1,1 120,160"/>
    </g>
    <g>
      <circle r="10" fill="url(#sPink)" filter="url(#glow)"/>
      <animateMotion dur="22s" begin="-11s" repeatCount="indefinite" path="M 120,160 A 330,62 0 1,1 780,160 A 330,62 0 1,1 120,160"/>
    </g>
    <g>
      <circle r="9" fill="url(#sPurple)" filter="url(#glow)"/>
      <animateMotion dur="14s" repeatCount="indefinite" path="M 220,160 A 230,42 0 1,0 680,160 A 230,42 0 1,0 220,160"/>
    </g>
    <g>
      <circle r="7" fill="url(#sGreen)" filter="url(#glow)"/>
      <animateMotion dur="14s" begin="-7s" repeatCount="indefinite" path="M 220,160 A 230,42 0 1,0 680,160 A 230,42 0 1,0 220,160"/>
    </g>
  </g>

  <!-- floating tech orbs (anti-gravity) -->
  <g font-family="monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#0f0c29">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="4.5s" repeatCount="indefinite"/>
      <circle cx="110" cy="95" r="30" fill="url(#sCyan)" filter="url(#glow)"/>
      <text x="110" y="99">PyTorch</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,14;0,0" dur="5.5s" repeatCount="indefinite"/>
      <circle cx="195" cy="225" r="26" fill="url(#sPurple)" filter="url(#glow)"/>
      <text x="195" y="229" fill="#fff">OpenCV</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/>
      <circle cx="790" cy="110" r="30" fill="url(#sPink)" filter="url(#glow)"/>
      <text x="790" y="114" fill="#fff">ESP32</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,16;0,0" dur="4.8s" repeatCount="indefinite"/>
      <circle cx="715" cy="230" r="26" fill="url(#sGreen)" filter="url(#glow)"/>
      <text x="715" y="234">React</text>
    </g>
  </g>

  <text x="450" y="302" text-anchor="middle" font-family="monospace" font-size="13" fill="#7df9ff" letter-spacing="3" opacity="0.9">DEFYING GRAVITY, ONE COMMIT AT A TIME</text>
</svg>
